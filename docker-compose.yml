services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: min_atoms
      POSTGRES_USER: min_atoms
      POSTGRES_PASSWORD: min_atoms
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U min_atoms -d min_atoms"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - min_atoms_postgres:/var/lib/postgresql/data

volumes:
  min_atoms_postgres:
