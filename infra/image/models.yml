providers:
  ma-gateway:
    baseUrl: http://ma-gateway:8081__GATEWAY_PATH__
    api: __OMP_MODEL_API__
    apiKey: min-atoms-placeholder
    authHeader: true
    models:
      - id: __OMP_MODEL_ID__
        name: Project model
        reasoning: false
        input: [text]
        # USD per million tokens at peak rates; actual off-peak usage is cheaper.
        cost:
          input: 0.30
          output: 1.20
          cacheRead: 0.006
          cacheWrite: 0
        contextWindow: 1048576
        maxTokens: 393216
